# shares, and the host triple a host-primary compilation adds.
config.substitutions.append(
    ("%{hip_device}", "-triple amdgcn-amd-amdhsa -fcuda-is-device -x hip")
)
config.substitutions.append(
    ("%{host_aux_triple}", "-aux-triple x86_64-unknown-linux-gnu")
)
